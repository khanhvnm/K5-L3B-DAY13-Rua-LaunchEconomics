# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Mọi số D1 do src/lab13.py (hàm in_d1) tính ra.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels NormalIndPower: 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 3.103 yêu cầu mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251, và chỉ 6 cụm (< 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi nhân viên, DE = 6,96.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi noi_dia + hang_nang.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản và log agent_suggestion_shown theo staff_id để phát hiện nhóm đối chứng dùng trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chỉ số chính, mde 0,06, luật dừng và decision_date chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên, không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên 20 + 20 và hạ mục tiêu xuống mức chênh 6 điểm (mde 0,06).
#   Con số bất lợi: nếu tác động thật chỉ là +5 điểm, power tại n = 859 còn 0,64 (không phải 0,80).
#   Cần m ≥ 299 yêu cầu mỗi nhân viên: mỗi nhân viên nhận khoảng 1.500 / 40 × 982 / 1.200 ≈ 30,7 yêu cầu trong phạm vi mỗi ngày,
#   nên bước 0.50 phải chạy ít nhất 10 ngày (2 tuần) mới đủ mẫu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) toàn mẫu, 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên chọn: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.
#   Bước 0.10 chỉ có 4 nhân viên dùng trợ lý, mức lệch 2 điểm dễ báo động giả: bước này chỉ áp dụng trần 6% và luật hoàn trùng;
#   mức lệch ≥ 2 điểm so với đối chứng áp dụng từ bước 0.25 (≥ 10 nhân viên). Bổ sung sau câu hỏi của hội đồng NhomABC ở Gate 2a.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ yêu cầu noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated) tại cả 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính ở bước 0.50 (2 tuần)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; tương ứng 20 × 299 = 5.980 yêu cầu thô mỗi nhóm
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi; bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản, log agent_suggestion_shown theo staff_id, loại khỏi phân tích nhân viên đối chứng có lượt mở trợ lý"
    predeclared: "Có: chỉ số chính, mde 0,06, alpha 0,05, ba luật dừng và decision_date chốt trong file này trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý vượt trần tuyệt đối 6% (đợt chạy thử: 3,97% trong phạm vi), hoặc có ≥ 1 ca hoàn trùng tiền, hoặc (chỉ từ bước 0.25, khi đã có ≥ 10 nhân viên dùng trợ lý) cao hơn đối chứng ≥ 2 điểm TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút, Kỹ sư trưởng agent rà trace trong 2 ngày và bật lại nếu là nhiễu KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí biến đổi mỗi việc thành công đo từ event (token, tool, phút xem lại và làm lại; không cộng 40 triệu đ/tháng cố định, khoản này thuộc quyết định mở rộng) > 8.000 đ (0,67× của 12.000 đ, còn chỗ cho chi phí cố định 2.370 đ/việc ở nửa khối lượng) TRONG 2 tuần liên tiếp (nên không kích hoạt ở bước 0.10 chỉ kéo dài 1 tuần) THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy (B3: rẻ nhất cho công ty) KHÔNG THÌ không được mở rộng sang bước rollout tiếp theo"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) > 40% (đợt chạy thử: 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và PM trợ lý hoàn phí rà 20 trace bị bỏ trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
    - "NẾU tỉ lệ được xem lại > 50% hoặc phút xem lại trung bình > 4,8 phút (mức hoà vốn B4, simulated) TRONG cả bước 0.25 THÌ Trưởng nhóm CSKH áp dụng giảm xem lại theo bậc khi tỉ lệ sửa + bỏ < 15% KHÔNG THÌ không được mở bước 0.50"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (hằng ngày) và các chỉ số trong luật dừng chi phí, sử dụng (hằng tuần); không xem chỉ số chính trước decision_date"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như nhóm đối chứng, yêu cầu đang chạy dở chuyển nhân viên kèm tóm tắt"
  decision_date: "2027-01-11"     # bắt đầu 2026-12-07; 0.10 và 0.25 mỗi bước 1 tuần; 0.50 chạy 2 tuần (đến 2027-01-03); cộng 7 ngày chờ mở lại
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (mọi tiền xem lại, làm lại)"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu, 3.414 đ trong phạm vi, 4.599 đ khi cộng cố định"
    - "Tỉ lệ so với 12.000 đ theo loại: noi_dia 0,22×, hang_nang 0,69×, quoc_te 1,88×, doi_tac 0,85×"
    - "Bảng độ nhạy B1–B3, trong đó giới hạn 2 lần chạy rẻ nhất cho công ty"
    - "B4 xem lại 100%: 0,98× (9 phút làm lại) và 1,03× (15,3 phút); hoà vốn 5,1 và 4,8 phút xem lại"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng"
